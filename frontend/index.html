<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Without this the browser requests /favicon.ico on every page load. In
      dev that is a 404 in the console; behind nginx it is worse -- the SPA
      fallback answers with index.html, so the browser gets HTML where it
      asked for an image.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ContextIQ</title>
    <!--
      Applies the theme before first paint, so a dark-mode user never sees a
      white flash while React boots. Deliberately duplicates the logic in
      src/hooks/useTheme.ts; the storage key must stay in sync with
      THEME_STORAGE_KEY there.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("contextiq-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {
          /* localStorage unavailable (private mode); fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
