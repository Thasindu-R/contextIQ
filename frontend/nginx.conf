# Serves the built SPA in the frontend container, and proxies the API.
# Single responsibility: static file serving + /api reverse proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Uploads are multipart PDFs and the backend accepts up to 20MB
    # (max_upload_size_mb). nginx's default cap is 1MB, which would reject
    # them here with an HTML 413 the client can't read as a `detail`
    # message -- before the request ever reaches FastAPI.
    client_max_body_size 25m;

    # Hashed filenames (index-<hash>.js) are content-addressed, so they can
    # be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the only file whose name is
    # stable, and it is what points at the current asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /ask and /documents have no file on disk, so
    # anything that isn't a real file falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API. This is why VITE_API_BASE_URL is empty by default --
    # the browser only ever talks to this origin, so the backend's CORS
    # settings never come into play. `backend` is the compose service name,
    # resolved by Docker's embedded DNS; compose's depends_on guarantees it
    # exists before nginx loads this config.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/v1/query is a Server-Sent Events stream. nginx buffers
        # proxied responses by default, which would accumulate the whole
        # answer and hand it over as one delayed blob -- the app would work
        # but stop streaming, which is exactly the failure the backend's
        # X-Accel-Buffering header exists to prevent. Turned off explicitly
        # rather than relying on that header alone.
        proxy_buffering off;
        proxy_cache off;
        # Clearing Connection keeps the upstream connection from being
        # closed between events.
        proxy_set_header Connection "";

        # Ingestion is synchronous and generation can run long; the 60s
        # default would cut a large PDF's upload or a slow answer short.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
